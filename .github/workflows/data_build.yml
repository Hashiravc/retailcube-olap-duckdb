name: RetailCube Data Build Pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/ingestion/**'
      - 'src/transformations/**'
      - 'sql/schema/**'

jobs:
  build_data:
    name: Ingestion, Star Schema & Parquet Generation
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest and Clean Dataset from UCI
        run: |
          python src/ingestion/download_and_ingest.py

      - name: Build Star Schema in Parquet & DuckDB
        run: |
          python src/transformations/build_star_schema.py

      - name: Verify Data & OLAP Queries
        run: |
          pytest -v tests/test_star_schema.py tests/test_olap_queries.py

      - name: Commit and Push Processed Parquet Data (Only if Changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/*.parquet
          if git diff --staged --quiet; then
            echo "No changes detected in processed Parquet files. Skipping commit."
          else
            git commit -m "chore(data): auto-update processed parquet star schema [skip ci]"
            git push
          fi
